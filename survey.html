<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>All-Pro Voting</title>
<style>
:root{--bg:#f3f4f1;--fg:#16181a;--card:#fff;--mut:#5d646b;--ac:#0b6b3a;--bd:#d5d9d6}
@media (prefers-color-scheme:dark){:root{--bg:#0f1311;--fg:#eaeeea;--card:#181d1a;--mut:#9aa39d;--ac:#4fd18b;--bd:#2c342f}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h2{margin:28px 0 2px;font-size:20px}.sub{color:var(--mut);margin:0 0 8px}
.c{display:block;width:100%;text-align:left;background:var(--card);color:var(--fg);border:2px solid var(--bd);border-radius:10px;padding:10px 12px;margin:8px 0;font:inherit}
.c.on{border-color:var(--ac)}.c b{display:block}.c span{color:var(--mut);font-size:14px;margin-right:12px;display:inline-block}
.c.on b::before{content:"\2713  ";color:var(--ac)}
input,textarea,select{width:100%;box-sizing:border-box;padding:10px;font:inherit;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg)}
.go{width:100%;margin-top:20px;padding:14px;border:0;border-radius:10px;background:var(--ac);color:var(--bg);font:600 17px system-ui}
.go:disabled{opacity:.4}#out{margin-top:16px}
</style></head><body><main>
<h1 id="t">All-Pro Voting</h1>
<p class="sub">Tap a player to pick them. Picking more than the allowed number drops your oldest pick. You confirm at the end.</p>
<label>Your team<select id="voter"></select></label>
<div id="b"></div>
<button class="go" id="go">Review and submit</button>
<div id="out"></div>
</main>
<script>
// create_survey.py replaces the placeholder below with:
// {id, title, teams: [team names for the dropdown], positions: [{pos, slots, cands: [<one CSV row per candidate, as an object>]}]}
const BALLOT = /*BALLOT*/null;

// What to show under each candidate: [label, CSV column, noStar]. Leader stars are computed here.
const RUSH = [["Carries","rushTotalAtt"],["Rushing Yards","rushTotalYds"],["Rushing TDs","rushTotalTDs"]];
const REC = [["Receptions","recTotalCatches"],["Receiving Yards","recTotalYds"],["Receiving TDs","recTotalTDs"]];
const DEF = [["Tackles","defTotalTackles"],["Sacks","defTotalSacks"],["Defl","defTotalDeflections"],["FF","defTotalForcedFum"]];
const DB = [["Tackles","defTotalTackles"],["INT","defTotalInts"],["Defl","defTotalDeflections"],["FF","defTotalForcedFum"],["TD","defTotalTDs"]];
const STATS = {
  QB: [["Pass Yds","passTotalYds"],["Pass TDs","passTotalTDs"],["INTs","passTotalInts",1],["Rating","passerAvgRating"]],
  RB: RUSH.concat([["Receiving Yards","recTotalYds"],["Receiving TDs","recTotalTDs"],["Fumbles","rushTotalFum",1]]),
  APO: RUSH.concat(REC),
  WR: REC.concat([["RAC","recTotalYdsAfterCatch"]]), TE: REC,
  EDGE: DEF, IDL: DEF, LB: DEF.concat([["INT","defTotalInts"],["TD","defTotalTDs"]]),
  CB: DB.concat([["Sacks","defTotalSacks"]]), FS: DB, SS: DB.concat([["Sacks","defTotalSacks"]]),
  K: [["FG Made","fGTotalMade"],["FG Att","fGTotalAtt"],["FG %","fGAvgCompPct"],["Long","fGTotalLongest"],["XP Made","xPTotalMade"]],
};
const num = v => { const n = parseFloat(String(v).replace(/,/g, "")); return isNaN(n) ? null : n; };
const fmt = v => { const n = num(v); return n === null ? "-" : n.toLocaleString("en-US", {maximumFractionDigits: 1}); };

function prepare(ballot) {   // raw rows in, display-ready candidates out
  return ballot.positions.map(p => {
    const set = STATS[p.pos] || [];
    const cands = p.cands.map(r => ({name: r.player__fullName, team: r.team__abbrName, tag: r.player__rosterId,
      stats: set.map(([l, col]) => ({l, v: fmt(r[col]), n: num(r[col]), star: false}))}));
    set.forEach(([l, col, noStar], i) => {
      if (noStar || cands.length < 2) return;
      const top = Math.max(...cands.map(c => c.stats[i].n ?? -Infinity));
      if (top > 0) cands.forEach(c => { c.stats[i].star = c.stats[i].n === top; });
    });
    return {pos: p.pos, slots: p.slots, cands};
  });
}
// ---- page ----
const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = id => document.getElementById(id), sel = {}, votes = {};   // sel = pick order per position; votes = the counter, 1 per picked candidate
let P = [];

function draw() {
  $("b").innerHTML = P.map(p => `<h2>${esc(p.pos)}</h2><p class="sub">Pick ${p.slots}</p>` + p.cands.map((c, i) =>
    `<button class="c${votes[p.pos][i] ? " on" : ""}" data-p="${p.pos}" data-i="${i}"><b>${esc(c.name)} <small>${esc(c.team)}</small></b>` +
    c.stats.map(s => `<span>${s.v}${s.star ? "*" : ""} ${esc(s.l)}</span>`).join("") + "</button>").join("")).join("");
}
function pick(pos, i) {
  const p = P.find(x => x.pos === pos), a = sel[pos], at = a.indexOf(i);
  if (at >= 0) a.splice(at, 1);
  else { a.push(i); if (a.length > p.slots) a.shift(); }   // pop from the front
  votes[pos] = p.cands.map((_, j) => a.includes(j) ? 1 : 0);   // counter, indexed by place in the candidate list
  draw();
}
function done(code) {
  $("go").style.display = "none"; $("b").style.display = "none";
  $("out").innerHTML = `<h2>Ballot locked</h2><p class="sub">Send this code to the commissioner. This device is locked to your team's ballot.</p><textarea rows="5" readonly>${code}</textarea>`;
}
// AUTH HOOK: swap for the Discord account id once login exists.
const getVoter = () => $("voter").value.trim();

function submit() {
  const v = getVoter();
  if (!v) return alert("Pick your team first.");
  const miss = P.filter(p => votes[p.pos].reduce((a, b) => a + b, 0) !== p.slots).map(p => p.pos);
  if (miss.length && !confirm("Incomplete: " + miss.join(", ") + ". Submit anyway?")) return;
  const picks = {};
  P.forEach(p => picks[p.pos] = p.cands.filter((_, j) => votes[p.pos][j]).map(c => c.name));
  const lines = Object.entries(picks).map(([k, n]) => `${k}: ${n.join(", ") || "-"}`).join("\n");
  if (!confirm("Confirm your ballot? This locks it.\n\n" + lines)) return;
  const code = btoa(unescape(encodeURIComponent(JSON.stringify({s: BALLOT.id, v, p: picks}))));
  try { localStorage.setItem("voted:" + BALLOT.id, code); } catch (e) {}
  done(code);
}
if (!BALLOT) document.body.innerHTML = "<main><p>This is the template. Run create_survey.py to build a survey from it.</p></main>";
else {
  $("t").textContent = BALLOT.title || "All-Pro Voting";
  $("voter").innerHTML = '<option value="">Pick your team…</option>' + (BALLOT.teams || []).map(t => `<option>${esc(t)}</option>`).join("");
  P = prepare(BALLOT); P.forEach(p => { sel[p.pos] = []; votes[p.pos] = p.cands.map(() => 0); });
  let prev = null; try { prev = localStorage.getItem("voted:" + BALLOT.id); } catch (e) {}
  if (prev) done(prev);
  else { draw(); $("go").onclick = submit; $("b").onclick = e => { const el = e.target.closest(".c"); if (el) pick(el.dataset.p, +el.dataset.i); }; }
}
</script></body></html>
